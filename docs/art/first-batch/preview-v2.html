<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전투 규격 · 대화 스탠딩</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#111b1d;color:#eee3cc;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto}h1{font-size:26px}h2{font-size:20px}p{color:#bec4bb;line-height:1.6}a{color:#e1bd77}button,select{background:#253639;color:#fff;border:1px solid #927749;padding:8px;margin-right:12px}.controls{margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{border:1px solid #8e784f;padding:14px;background:#1b292b}.render{width:100%;height:auto;display:block;background:var(--stage,#5a635a)}.dialogue{height:640px;position:relative;overflow:hidden;background:linear-gradient(#64716d,#303f37);border:1px solid #947d52}.standing{position:absolute;height:620px;left:4%;bottom:-40px}.dialogue-box{position:absolute;bottom:18px;left:4%;right:4%;background:#101d20ed;border:2px solid #a68c50;padding:18px 24px;min-height:130px}.dialogue-box strong{color:#e3bd72;font-size:22px}.dialogue-box p{color:#fff}.portrait-row{display:flex;gap:16px;align-items:center;margin:16px 0}.portrait-row canvas{width:128px;height:128px;background:#223737;border:2px solid #a48b50}.status{font-size:13px}label{margin-right:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}.standing{left:-50px}.dialogue{height:540px}.standing{height:520px}}
</style><main><h1>전투 규격과 대화용 스탠딩 · v2</h1><p>같은 머리–지면 기준으로 정렬한 전투 이미지와, 하나의 스탠딩 원본을 사용하는 대화·초상화 미리보기.</p>
<div class="controls"><label>배경 <select id="bg"><option value="#5a635a">중간색</option><option value="#142024">어두운 색</option><option value="#e9dfc9">밝은 색</option></select></label><label><input type="checkbox" id="guides" checked> 크기·지면 기준선</label></div><div id="grid" class="grid"></div>
<h2>유비 · 대화용 스탠딩</h2><p>고유 인물은 머리부터 허리 아래까지 제작. 아래 대사는 화면 검토용 임시 문구입니다.</p><div class="dialogue"><img class="standing" src="standing/liu-bei-neutral-v1.png" alt="유비 대화용 상반신 스탠딩"><div class="dialogue-box"><strong>유비</strong><p>모두 준비되었는가. 함께 나아가세.</p></div></div>
<div class="portrait-row"><canvas id="portrait" width="256" height="256" aria-label="동일한 스탠딩에서 표시한 유비 초상화"></canvas><p>동일한 스탠딩 원본에서 얼굴 영역만 표시합니다.<br>대화와 전투 카드의 얼굴이 서로 달라지지 않습니다.</p></div><p id="status" class="status">불러오는 중…</p><p><a href="README.md">제작 기준</a> · <a href="asset-layout.js">전투 표시 좌표</a> · <a href="preview.html">이전 버전</a></p></main>
<script src="asset-layout.js"></script><script>
const layout=window.ART_LAYOUT,loaded=[];const grid=document.querySelector('#grid');
function getImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error(src));im.src=src;});}
function paint(){for(const {a,im,canvas} of loaded){const ctx=canvas.getContext('2d'),[w,h]=[canvas.width,canvas.height];ctx.clearRect(0,0,w,h);const s=layout.bodyHeight/(a.ground[1]-a.headY);ctx.drawImage(im,w/2-a.ground[0]*s,layout.footY-a.ground[1]*s,im.width*s,im.height*s);if(document.querySelector('#guides').checked){ctx.strokeStyle='#f1d489';ctx.lineWidth=1;ctx.setLineDash([8,6]);for(const y of [layout.footY,layout.footY-layout.bodyHeight]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.setLineDash([]);ctx.fillStyle='#f1d489';ctx.beginPath();ctx.arc(w/2,layout.footY,5,0,Math.PI*2);ctx.fill()}}}
async function start(){for(const a of layout.assets){const im=await getImage(a.src);const article=document.createElement('article');const title=document.createElement('h2');title.textContent=a.name;const canvas=document.createElement('canvas');canvas.width=768;canvas.height=a.canvas[1];canvas.className='render';canvas.setAttribute('aria-label',a.name+' 크기 정렬');const info=document.createElement('p');info.textContent=a.canvas.join(' × ')+' 논리 캔버스 · 인물 기준 높이 340 · 지면 Y 460';article.append(title,canvas,info);grid.append(article);loaded.push({a,im,canvas})}paint();const im=await getImage('standing/liu-bei-neutral-v1.png');const ctx=document.querySelector('#portrait').getContext('2d');const c=window.STANDING_CROP||{x:.28,y:0,w:.50,h:.34};const side=Math.min(im.width*c.w,im.height*c.h);ctx.drawImage(im,im.width*c.x,im.height*c.y,side,side,0,0,256,256);document.querySelector('#status').textContent='전투 이미지 4종·스탠딩·동일 원본 초상화 로드 완료.';document.body.dataset.ready='true'}
document.querySelector('#guides').addEventListener('change',paint);document.querySelector('#bg').addEventListener('change',e=>document.documentElement.style.setProperty('--stage',e.target.value));start().catch(e=>{document.querySelector('#status').textContent='로드 오류: '+e.message;document.body.dataset.ready='error'});
</script></html>
